version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: parlamento_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parlamento_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parlamento_pass}
      POSTGRES_DB: ${POSTGRES_DB:-parlamento_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/backup:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parlamento_user} -d ${POSTGRES_DB:-parlamento_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 350M

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parlamento_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-parlamento_user}:${POSTGRES_PASSWORD:-parlamento_pass}@db:5432/${POSTGRES_DB:-parlamento_db}
      - DATABASE_SYNC_URL=postgresql+psycopg2://${POSTGRES_USER:-parlamento_user}:${POSTGRES_PASSWORD:-parlamento_pass}@db:5432/${POSTGRES_DB:-parlamento_db}
      - APP_ENV=production
      - DEBUG=False
      - ENABLE_SCHEDULER=True
      - SYNC_INTERVAL_MINUTES=30
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 350M

  caddy:
    image: caddy:2-alpine
    container_name: parlamento_caddy
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          memory: 100M

  # Servicio opcional de Cloudflare Tunnel integrado en el compose.
  # Para activarlo: asigna tu token en .env (CLOUDFLARE_TUNNEL_TOKEN)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: parlamento_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web
    profiles:
      - tunnel
    deploy:
      resources:
        limits:
          memory: 120M

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
